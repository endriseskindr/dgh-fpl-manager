name: Build DGH FPL Manager Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build DGH FPL Manager Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: pnpm install

      - name: Run Verification Tests
        run: pnpm run validate

      - name: Prebuild Native Android Project
        run: |
          npx expo prebuild --platform android --no-install
          python3 -c '
          with open("android/settings.gradle", "r") as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              new_lines.append(line)
              if "pluginManagement {" in line:
                  new_lines.append("  repositories {\n    mavenCentral()\n    google()\n    gradlePluginPortal()\n  }\n")
          with open("android/settings.gradle", "w") as f:
              f.writelines(new_lines)
          '

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --console=plain --stacktrace

      - name: Verify FPL App Artifact
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            return 1
          fi
          echo "APK found successfully at $APK_PATH"
          echo "APK Size: $(stat -c%s "$APK_PATH") bytes"
          echo "SHA-256: $(sha256sum "$APK_PATH" | awk '{print $1}')"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgh-fpl-manager-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
